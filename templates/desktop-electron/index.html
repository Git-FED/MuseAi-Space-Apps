<!doctype html><html><head><meta charset="utf-8"><title>Muse 3 Desktop</title><style>html,body{margin:0;height:100%;background:#070807;color:#eee;font:14px system-ui}main{height:calc(100% - 64px);display:grid;place-items:center}nav{height:64px;background:#000;display:flex;justify-content:center;gap:10px}button{margin:14px 0;background:#171817;border:1px solid #343633;color:#eee;padding:0 24px;border-radius:4px}button:hover{border-color:#d7ff4f;color:#d7ff4f}</style></head><body><main><p>Desktop slot surface — connect each button to a top-level Muse URL.</p></main><nav><button data-slot="3">MUSE 3</button><button data-slot="2">MUSE 2</button><button data-slot="1">MUSE 1</button></nav><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>document.querySelector('main p').textContent='Selected Muse '+b.dataset.slot);</script></body></html>
